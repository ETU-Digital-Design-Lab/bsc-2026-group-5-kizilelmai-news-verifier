name: kizilelmai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/new_logo_1.png

# --- 1. UYGULAMA İKON AYARLARI ---
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

# --- 2. SPLASH (AÇILIŞ EKRANI) AYARLARI ---
flutter_native_splash:
  # DÜZELTME: Burası "#FFFFFF" (BEYAZ) oldu. Artık lacivert değil.
  color: "#FFFFFF" 
  
  image: assets/images/new_logo_1.png
  fullscreen: false # Üst bar görünsün (Daha profesyonel)
  
  # Logoyu sündürme, ortala
  gravity: center
  ios_content_mode: center

  android_12:
    image: assets/images/new_logo_1.png
    # DÜZELTME: Burayı da "#FFFFFF" yaptık
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"