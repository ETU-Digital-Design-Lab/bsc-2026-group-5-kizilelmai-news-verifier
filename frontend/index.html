<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KızılelmAI – Profesyonel Doğrulama Paneli</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --bg: #050607;
      --panel: rgba(15, 20, 25, 0.7);
      --panel-light: rgba(33, 43, 54, 0.9);
      --text: #f5f7fb;
      --muted: #97a2b3;
      --accent: linear-gradient(135deg, #ff4d6d, #ff9f1c);
      --border: rgba(255, 255, 255, 0.1);
      --success: #46e59f;
      --danger: #ff4d6d;
      --warning: #ffd166;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top right, #1a2a3a, #050607 70%);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navbar */
    nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(5, 6, 7, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .nav-brand img {
      height: 38px;
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Section */
    main {
      margin-top: var(--nav-height);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .view {
      display: none;
      width: 100%;
      max-width: 900px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view.active {
      display: block;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Chat Wrapper */
    .chat-container {
      height: 82vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .chat-body {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Bubbles & Cards */
    .bubble {
      max-width: 80%;
      padding: 18px 22px;
      border-radius: 22px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2);
    }

    /* Report Card Design */
    .report-card {
      align-self: flex-start;
      width: 100%;
      max-width: 650px;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-ONAY { background: rgba(70, 229, 159, 0.15); color: var(--success); }
    .status-RED { background: rgba(255, 77, 109, 0.15); color: var(--danger); }
    .status-KISMI { background: rgba(255, 159, 28, 0.15); color: var(--warning); }
    .status-RET { background: rgba(151, 162, 179, 0.15); color: var(--muted); }

    .category-tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 10px 0;
    }

    .stat-item {
      background: rgba(0,0,0,0.2);
      padding: 14px;
      border-radius: 16px;
    }

    .stat-label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-bar-bg {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .source-box {
      margin-top: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      font-size: 0.85rem;
      border-left: 3px solid #ff4d6d;
    }

    /* Input Area */
    .input-area {
      padding: 30px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid var(--border);
    }

    .search-box {
      display: flex;
      gap: 15px;
      background: rgba(255,255,255,0.05);
      padding: 8px 8px 8px 24px;
      border-radius: 100px;
      border: 1px solid var(--border);
      transition: 0.3s;
    }

    .search-box:focus-within {
      border-color: #ff4d6d;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.1);
    }

    input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
    }

    .btn-send {
      background: var(--accent);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .btn-send:hover { transform: scale(1.1); }

    /* Typing Animation */
    .loader {
      display: flex;
      gap: 15px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #ff4d6d;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Data Table Styles */
    .data-card {
      background: var(--panel);
      border-radius: 20px;
      padding: 0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 16px 24px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { background: rgba(255,255,255,0.03); color: var(--muted); font-size: 0.8rem; }
  </style>
</head>

<body>
  <nav>
    <div class="nav-brand" onclick="switchView('home')">
      <img src="assets/logo.png" alt="Logo" />
      <span>KızılelmAI</span>
    </div>
    <div class="nav-links">
      <button class="nav-link active" id="btn-home" onclick="switchView('home')">Doğrulayıcı</button>
      <button class="nav-link" id="btn-data" onclick="switchView('data')">Veritabanı</button>
    </div>
  </nav>

  <main>
    <!-- Ana Sayfa -->
    <section id="view-home" class="view active">
      <div class="chat-container">
        <div class="chat-body" id="chatBody">
          <div class="bubble ai" style="background: rgba(255,255,255,0.03);">
            🛡️ Merhaba! Ben KızılelmAI. Herhangi bir iddiayı veya haberi aşağıya yazarak doğruluğunu saniyeler içinde analiz etmemi sağlayabilirsiniz.
          </div>
        </div>
        <div class="input-area">
          <form id="chatForm" class="search-box">
            <input type="text" id="chatInput" placeholder="Bir iddia girin (Örn: İstanbul'un nüfusu 20 milyondur)" autocomplete="off" />
            <button type="submit" class="btn-send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- Veri Görünümü -->
    <section id="view-data" class="view">
      <div class="data-card">
        <div style="overflow-x: auto;">
          <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:5000";
    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    function switchView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('btn-' + name).classList.add('active');
      if(name === 'data') fetchVeri();
    }

    function appendReportCard(data) {
      const card = document.createElement('div');
      card.className = 'report-card';
      
      card.innerHTML = `
        <div class="card-header">
          <span class="status-badge status-${data.status}">${data.msg}</span>
          <span class="category-tag">📁 ${data.category}</span>
        </div>
        <div style="font-size: 1.1rem; font-weight: 600; line-height: 1.4;">${data.description}</div>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-label">GÜVENİLİRLİK</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: 0%; background: var(--success)" id="conf-${Date.now()}"></div>
            </div>
            <div style="font-size: 0.8rem; margin-top: 6px; text-align: right; font-weight: 700;">%${data.confidence}</div>
          </div>
          <div class="stat-item">
            <span class="stat-label">HATA RİSKİ</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: 0%; background: var(--danger)" id="risk-${Date.now()}"></div>
            </div>
            <div style="font-size: 0.8rem; margin-top: 6px; text-align: right; font-weight: 700;">%${data.risk}</div>
          </div>
        </div>
        <div class=\"source-box\">
           <strong style=\"font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 6px; letter-spacing: 0.5px;\">REFERANS KAYNAK</strong>
           <div style=\"line-height: 1.5; color: rgba(255,255,255,0.9);\">${data.source}</div>
        </div>
      `;
      
      chatBody.appendChild(card);
      chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });

      // Animate Bars after a tiny delay
      setTimeout(() => {
        card.querySelectorAll('.stat-bar-fill').forEach(bar => {
           const val = bar.id.startsWith('conf') ? data.confidence : data.risk;
           bar.style.width = val + '%';
        });
      }, 50);
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = chatInput.value.trim();
      if(!query) return;

      // User Bubble
      const userB = document.createElement('div');
      userB.className = 'bubble user';
      userB.textContent = query;
      chatBody.appendChild(userB);
      chatInput.value = '';

      // Loading Machine
      const loading = document.createElement('div');
      loading.className = 'loader';
      loading.innerHTML = `
        <div class=\"dots\"><div class=\"dot\"></div><div class=\"dot\"></div><div class=\"dot\"></div></div>
        <span id=\"thinking\">Veri tabanı taranıyor...</span>
      `;
      chatBody.appendChild(loading);
      chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });

      const thinkingSteps = [
        "Semantik bağlam analiz ediliyor...", 
        "Sniper (Re-ranker) katmanı devrede...", 
        "NLI çelişki kontrolü yapılıyor...", 
        "Kategorik karşılaştırma (Layer 5) tamamlanıyor...",
        "Rapor oluşturuluyor..."
      ];
      let step = 0;
      const interval = setInterval(() => {
        const span = loading.querySelector('#thinking');
        if(span) span.textContent = thinkingSteps[step % thinkingSteps.length];
        step++;
      }, 900);

      try {
        const res = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query})
        });
        const data = await res.json();
        clearInterval(interval);
        chatBody.removeChild(loading);

        if(res.ok) {
          appendReportCard(data);
        } else {
          const errorB = document.createElement('div');
          errorB.className = 'bubble ai';
          errorB.textContent = '❌ Sunucuyla iletişim sırasında bir hata oluştu.';
          chatBody.appendChild(errorB);
        }
      } catch(err) {
        clearInterval(interval);
        chatBody.removeChild(loading);
        const errorB = document.createElement('div');
        errorB.className = 'bubble ai';
        errorB.textContent = "❌ Sunucuya ulaşılamıyor. Lütfen backend'in çalıştığından emin olun.";
        chatBody.appendChild(errorB);
      }
    });

    async function fetchVeri() {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = '<tr><th>Yükleniyor...</th></tr>';
      try {
        const res = await fetch(API_BASE + '/api/veri');
        const data = await res.json();
        if(data && data.length > 0) {
          const keys = Object.keys(data[0]);
          head.innerHTML = '<tr>' + keys.map(k => `<th>${k.toUpperCase()}</th>`).join('') + '</tr>';
          body.innerHTML = data.map(row => '<tr>' + keys.map(k => `<td>${row[k] || ''}</td>`).join('') + '</tr>').join('');
        }
      } catch(e) { head.innerHTML = '<tr><th>Veri çekilemedi.</th></tr>'; }
    }
  </script>
</body>

</html>
