version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kizilelmai_db
    environment:
      - POSTGRES_USER=kizilelmai_user
      - POSTGRES_PASSWORD=kizilelmai_pass
      - POSTGRES_DB=kizilelmai
    ports:
      - "5433:5432"
    volumes:
      - kizilelmai_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kizilelmai_redis
    ports:
      - "6379:6379"
    volumes:
      - kizilelmai_redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  backend:
    build: .
    container_name: kizilelmai_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://kizilelmai_user:kizilelmai_pass@db:5432/kizilelmai
      - REDIS_HOST=redis
      - HF_HOME=/app/.cache/huggingface
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - kizilelmai_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: kizilelmai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kizilelmai_data:
  kizilelmai_redis_data:
  kizilelmai_hf_cache:
